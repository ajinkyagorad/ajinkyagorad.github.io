<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ajinkya Gorad</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-x" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="root"></div>
    <script type="text/babel">
      function BlogPage() {
        const [posts, setPosts] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        
        React.useEffect(() => {
          fetch('blog/posts.json')
            .then(r => r.json())
            .then(data => {
              setPosts(data);
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }, []);

        if (loading) {
          return <div className="blog-loading">Loading posts...</div>;
        }

        return (
          <div className="blog-magazine">
            <div className="magazine-header">
              <h1>Blog & Writings</h1>
              <p className="magazine-subtitle">Thoughts on engineering, design, and technology</p>
            </div>
            <div className="blog-grid">
              {posts.map((post, idx) => (
                <article className={`blog-card ${idx === 0 ? 'blog-featured' : ''}`} key={post.url}>
                  <a href={post.url} className="card-link">
                    <div className="blog-card-content">
                      <div className="blog-meta">
                        <time className="blog-date">{post.date}</time>
                        <span className="blog-category">
                          <i className="fas fa-bookmark"></i> Article
                        </span>
                      </div>
                      <h3>{post.title}</h3>
                      <p className="blog-excerpt">{post.excerpt}</p>
                      <div className="read-more">
                        Read More <i className="fas fa-arrow-right"></i>
                      </div>
                    </div>
                  </a>
                </article>
              ))}
            </div>
            {posts.length === 0 && !loading && (
              <div className="no-posts">
                <p>No blog posts found.</p>
              </div>
            )}
          </div>
        );
      }

      function ProjectsPage() {
        const [repos, setRepos] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        
        React.useEffect(() => {
          fetch('https://api.github.com/users/ajinkyagorad/repos')
            .then(r => r.json())
            .then(async repos => {
              const detailed = await Promise.all(
                repos.map(async repo => {
                  try {
                    const langResp = await fetch(repo.languages_url);
                    const langData = await langResp.json();
                    repo.languages = Object.keys(langData).join(', ');
                  } catch (e) {
                    repo.languages = repo.language || '';
                  }
                  repo.image = `https://opengraph.githubassets.com/1/${repo.full_name}`;
                  return repo;
                })
              );
              // Sort by stars and updated date
              const sorted = detailed.sort((a, b) => {
                const starsA = a.stargazers_count || 0;
                const starsB = b.stargazers_count || 0;
                if (starsB !== starsA) return starsB - starsA;
                return new Date(b.updated_at) - new Date(a.updated_at);
              });
              setRepos(sorted);
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }, []);

        if (loading) {
          return <div className="projects-loading">Loading projects...</div>;
        }

        const featured = repos.slice(0, 3);
        const regular = repos.slice(3);

        return (
          <div className="projects-magazine">
            <div className="magazine-header">
              <h1>Project Portfolio</h1>
              <p className="magazine-subtitle">A curated collection of software, robotics, and mechanical engineering projects</p>
            </div>

            {featured.length > 0 && (
              <div className="featured-section">
                <h2 className="section-title">Featured Projects</h2>
                <div className="featured-grid">
                  {featured.map((repo, idx) => (
                    <article className={`featured-card featured-${idx + 1}`} key={repo.id}>
                      <a href={repo.html_url} target="_blank" rel="noopener noreferrer" className="card-link">
                        <div className="card-image-wrapper">
                          <img src={repo.image} alt={repo.name} />
                          <div className="card-overlay">
                            <div className="card-stats">
                              {repo.stargazers_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-star"></i> {repo.stargazers_count}
                                </span>
                              )}
                              {repo.forks_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-code-branch"></i> {repo.forks_count}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                        <div className="card-content">
                          <h3>{repo.name}</h3>
                          <p className="card-description">{repo.description || 'No description available'}</p>
                          {repo.languages && (
                            <div className="card-tags">
                              {repo.languages.split(', ').slice(0, 3).map(lang => (
                                <span className="tag" key={lang}>{lang}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </a>
                    </article>
                  ))}
                </div>
              </div>
            )}

            {regular.length > 0 && (
              <div className="regular-section">
                <h2 className="section-title">All Projects</h2>
                <div className="projects-grid">
                  {regular.map(repo => (
                    <article className="project-card-magazine" key={repo.id}>
                      <a href={repo.html_url} target="_blank" rel="noopener noreferrer" className="card-link">
                        <div className="card-image-wrapper">
                          <img src={repo.image} alt={repo.name} />
                          <div className="card-overlay">
                            <div className="card-stats">
                              {repo.stargazers_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-star"></i> {repo.stargazers_count}
                                </span>
                              )}
                              {repo.forks_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-code-branch"></i> {repo.forks_count}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                        <div className="card-content">
                          <h3>{repo.name}</h3>
                          <p className="card-description">{repo.description || 'No description available'}</p>
                          {repo.languages && (
                            <div className="card-tags">
                              {repo.languages.split(', ').slice(0, 2).map(lang => (
                                <span className="tag" key={lang}>{lang}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </a>
                    </article>
                  ))}
                </div>
              </div>
            )}

            {repos.length === 0 && !loading && (
              <div className="no-projects">
                <p>No projects found.</p>
              </div>
            )}
          </div>
        );
      }

      const pages = {
        home: () => (
          <div className="home-hero">
            <div className="hero-content">
              <div className="hero-badge">
                <i className="fas fa-rocket"></i> Engineer & Creator
              </div>
              <h1 className="hero-title">Ajinkya Gorad</h1>
              <p className="hero-subtitle">Mechanical Engineering • Software Development • Robotics</p>
              <p className="hero-description">
                Crafting innovative solutions at the intersection of hardware and software. 
                Passionate about building intelligent systems that push the boundaries of what's possible.
              </p>
              <div className="hero-stats">
                <div className="stat-item">
                  <div className="stat-number">
                    <i className="fas fa-code"></i>
                  </div>
                  <div className="stat-label">Open Source</div>
                </div>
                <div className="stat-item">
                  <div className="stat-number">
                    <i className="fas fa-cogs"></i>
                  </div>
                  <div className="stat-label">Engineering</div>
                </div>
                <div className="stat-item">
                  <div className="stat-number">
                    <i className="fas fa-robot"></i>
                  </div>
                  <div className="stat-label">Robotics</div>
                </div>
              </div>
              <div className="hero-cta">
                <a href="https://github.com/ajinkyagorad" target="_blank" rel="noopener" className="cta-primary">
                  <i className="fab fa-github"></i> View GitHub
                </a>
                <a href="https://grabcad.com/triton7777-1" target="_blank" rel="noopener" className="cta-secondary">
                  <i className="fas fa-cube"></i> GrabCAD
                </a>
              </div>
              <div className="hero-links">
                <a href="https://triton7777.wordpress.com/" target="_blank" rel="noopener" className="hero-link">
                  <i className="fas fa-pen-nib"></i> WordPress Blog
                </a>
              </div>
            </div>
            <div className="hero-decoration">
              <div className="decoration-circle decoration-1"></div>
              <div className="decoration-circle decoration-2"></div>
              <div className="decoration-circle decoration-3"></div>
            </div>
          </div>
        ),
        about: () => (
          <div className="about-elegant">
            <div className="magazine-header">
              <h1>About Me</h1>
              <p className="magazine-subtitle">Engineer, Builder, Problem Solver</p>
            </div>
            <div className="about-content">
              <div className="about-intro">
                <p className="about-lead">
                  Hello! I'm Ajinkya Gorad, a passionate engineer with a deep love for creating things 
                  that matter. My work spans across mechanical engineering, software development, and robotics.
                </p>
              </div>
              <div className="about-grid">
                <div className="about-card">
                  <div className="about-icon">
                    <i className="fas fa-drafting-compass"></i>
                  </div>
                  <h3>Mechanical Engineering</h3>
                  <p>Designing innovative mechanical systems and CAD models. Bringing ideas from concept to reality through precision engineering.</p>
                </div>
                <div className="about-card">
                  <div className="about-icon">
                    <i className="fas fa-code"></i>
                  </div>
                  <h3>Software Development</h3>
                  <p>Building robust applications and tools. Passionate about clean code, elegant solutions, and open source contributions.</p>
                </div>
                <div className="about-card">
                  <div className="about-icon">
                    <i className="fas fa-microchip"></i>
                  </div>
                  <h3>Robotics & Electronics</h3>
                  <p>Creating intelligent systems that bridge the physical and digital worlds. From embedded systems to autonomous solutions.</p>
                </div>
              </div>
              <div className="about-philosophy">
                <h3>Philosophy</h3>
                <p>
                  I believe in sharing knowledge and contributing to the community. My projects reflect 
                  a commitment to innovation, quality, and the pursuit of excellence in everything I create.
                </p>
              </div>
              <div className="about-connect">
                <h3>Let's Connect</h3>
                <div className="connect-links">
                  <a href="https://twitter.com/AjinkyaGorad" target="_blank" rel="noopener" className="connect-btn">
                    <i className="fab fa-twitter"></i> Twitter
                  </a>
                  <a href="https://github.com/ajinkyagorad" target="_blank" rel="noopener" className="connect-btn">
                    <i className="fab fa-github"></i> GitHub
                  </a>
                  <a href="https://www.linkedin.com/in/ajinkyagorad" target="_blank" rel="noopener" className="connect-btn">
                    <i className="fab fa-linkedin"></i> LinkedIn
                  </a>
                </div>
              </div>
            </div>
          </div>
        ),
        blog: BlogPage,
        projects: ProjectsPage
      };

    function App() {
      const [page, setPage] = React.useState('home');
      const PageComponent = pages[page];
      return (
        <div className="container">
          <nav>
            <button onClick={() => setPage('home')}>Home</button>
            <button onClick={() => setPage('about')}>About</button>
            <button onClick={() => setPage('blog')}>Blog</button>
            <button onClick={() => setPage('projects')}>Projects</button>
          </nav>
          <PageComponent />
          <footer>
            <button onClick={() => window.location='mailto:ajinkyagorad@gmail.com'}>Mail Me</button>
            <button onClick={() => window.open('https://github.com/ajinkyagorad','_blank')}>Github</button>
            <button onClick={() => window.open('https://twitter.com/ajinkya_gorad','_blank')}>Twitter</button>
            <button onClick={() => window.open('https://www.linkedin.com/in/ajinkyagorad','_blank')}>LinkedIn</button>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script type="module">
    import { startStarfield } from './js/starfield.js';
    startStarfield(document.getElementById('starfield'));
  </script>
  <script type="module">
    import { startP5Background } from './js/p5background.js';
    startP5Background();
  </script>
</body>
</html>
