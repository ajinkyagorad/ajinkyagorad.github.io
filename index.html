<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ajinkya Gorad - Mechanical designs, software and robotics projects">
  <title>Ajinkya Gorad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="root"></div>
    <script type="text/babel">
      function BlogPage() {
        const [posts, setPosts] = React.useState([]);
        React.useEffect(() => {
          fetch('blog/posts.json')
            .then(r => r.json())
            .then(setPosts)
            .catch(() => {});
        }, []);
        return (
          <div className="blog">
            <h1>Blog</h1>
            <div className="blog-list">
              {posts.map(post => (
                <div className="post-item" key={post.url}>
                  <h3><a href={post.url}>{post.title}</a></h3>
                  <small>{post.date}</small>
                  <p>{post.excerpt}</p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function ProjectsPage() {
        const [repos, setRepos] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [error, setError] = React.useState(null);
        
        React.useEffect(() => {
          fetch('https://api.github.com/users/ajinkyagorad/repos?sort=updated&per_page=100')
            .then(r => {
              if (!r.ok) throw new Error('Failed to fetch repositories');
              return r.json();
            })
            .then(async repos => {
              const filtered = repos.filter(r => !r.fork && !r.archived);
              const detailed = await Promise.all(
                filtered.map(async repo => {
                  try {
                    const langResp = await fetch(repo.languages_url);
                    const langData = await langResp.json();
                    repo.languages = Object.keys(langData).join(', ');
                  } catch (e) {
                    repo.languages = repo.language || '';
                  }
                  repo.image = `https://opengraph.githubassets.com/1/${repo.full_name}`;
                  return repo;
                })
              );
              setRepos(detailed);
              setLoading(false);
            })
            .catch(err => {
              setError(err.message);
              setLoading(false);
            });
        }, []);

        if (loading) {
          return (
            <div className="projects-container">
              <h1>Projects</h1>
              <div className="loading">Loading repositories...</div>
            </div>
          );
        }

        if (error) {
          return (
            <div className="projects-container">
              <h1>Projects</h1>
              <div className="error">Error loading repositories. Please try again later.</div>
            </div>
          );
        }

        return (
          <div className="projects-container">
            <h1>Projects</h1>
            <p className="projects-subtitle">Explore my GitHub repositories showcasing various projects in software, robotics, and mechanical design.</p>
            <div className="projects-stats">
              <span><i className="fas fa-code-branch"></i> {repos.length} Repositories</span>
              <span><i className="fas fa-star"></i> {repos.reduce((acc, r) => acc + r.stargazers_count, 0)} Total Stars</span>
            </div>
            <div className="projects">
              {repos.map(repo => (
                <div className="project-card" key={repo.id}>
                  <img src={repo.image} alt={repo.name} loading="lazy" />
                  <div className="project-content">
                    <h3>
                      <a href={repo.html_url} target="_blank" rel="noopener noreferrer">
                        {repo.name}
                      </a>
                    </h3>
                    <p>{repo.description || 'No description available'}</p>
                    <div className="project-meta">
                      {repo.languages && (
                        <span className="languages"><i className="fas fa-code"></i> {repo.languages}</span>
                      )}
                      {repo.stargazers_count > 0 && (
                        <span className="stars"><i className="fas fa-star"></i> {repo.stargazers_count}</span>
                      )}
                      {repo.forks_count > 0 && (
                        <span className="forks"><i className="fas fa-code-branch"></i> {repo.forks_count}</span>
                      )}
                    </div>
                    {repo.homepage && (
                      <a href={repo.homepage} target="_blank" rel="noopener noreferrer" className="homepage-link">
                        <i className="fas fa-external-link-alt"></i> Live Demo
                      </a>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const pages = {
        home: () => (
          <div className="home">
            <h1>Welcome to Ajinkya Gorad's Universe</h1>
            <p>Explore mechanical designs, software and robotics projects from my GitHub portfolio.</p>
            <div className="home-links">
              <a href="https://github.com/ajinkyagorad" target="_blank" rel="noopener">
                <i className="fab fa-github"></i> GitHub
              </a>
              <a href="https://grabcad.com/triton7777-1" target="_blank" rel="noopener">
                <i className="fas fa-cube"></i> GrabCAD
              </a>
              <a href="https://triton7777.wordpress.com/" target="_blank" rel="noopener">
                <i className="fas fa-pen-nib"></i> Blog
              </a>
            </div>
          </div>
        ),
        about: () => (
          <div className="about">
            <h1>About</h1>
            <p>To post stuff that people might care about.</p>
            <ul className="contacts">
              <li><a href="https://twitter.com/AjinkyaGorad">Twitter</a></li>
            </ul>
          </div>
        ),
        blog: BlogPage,
        projects: ProjectsPage
      };

    function App() {
      const [page, setPage] = React.useState('home');
      const PageComponent = pages[page];
      return (
        <div className="container">
          <nav>
            <button onClick={() => setPage('home')}>Home</button>
            <button onClick={() => setPage('about')}>About</button>
            <button onClick={() => setPage('blog')}>Blog</button>
            <button onClick={() => setPage('projects')}>Projects</button>
          </nav>
          <PageComponent />
          <footer>
            <button onClick={() => window.location='mailto:ajinkyagorad@gmail.com'}>Mail Me</button>
            <button onClick={() => window.open('https://github.com/ajinkyagorad','_blank')}>Github</button>
            <button onClick={() => window.open('https://twitter.com/ajinkya_gorad','_blank')}>Twitter</button>
            <button onClick={() => window.open('https://www.linkedin.com/in/ajinkyagorad','_blank')}>LinkedIn</button>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script type="module">
    import { startStarfield } from './js/starfield.js';
    startStarfield(document.getElementById('starfield'));
  </script>
  <script type="module">
    import { startP5Background } from './js/p5background.js';
    startP5Background();
  </script>
</body>
</html>
