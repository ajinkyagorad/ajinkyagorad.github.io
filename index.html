<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ajinkya Gorad</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-x" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="root"></div>
    <script type="text/babel">
      function BlogPage() {
        const [posts, setPosts] = React.useState([]);
        React.useEffect(() => {
          fetch('blog/posts.json')
            .then(r => r.json())
            .then(setPosts)
            .catch(() => {});
        }, []);
        return (
          <div className="blog">
            <h1>Blog</h1>
            <div className="blog-list">
              {posts.map(post => (
                <div className="post-item" key={post.url}>
                  <h3><a href={post.url}>{post.title}</a></h3>
                  <small>{post.date}</small>
                  <p>{post.excerpt}</p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function ProjectsPage() {
        const [repos, setRepos] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        
        React.useEffect(() => {
          fetch('https://api.github.com/users/ajinkyagorad/repos')
            .then(r => r.json())
            .then(async repos => {
              const detailed = await Promise.all(
                repos.map(async repo => {
                  try {
                    const langResp = await fetch(repo.languages_url);
                    const langData = await langResp.json();
                    repo.languages = Object.keys(langData).join(', ');
                  } catch (e) {
                    repo.languages = repo.language || '';
                  }
                  repo.image = `https://opengraph.githubassets.com/1/${repo.full_name}`;
                  return repo;
                })
              );
              // Sort by stars and updated date
              const sorted = detailed.sort((a, b) => {
                const starsA = a.stargazers_count || 0;
                const starsB = b.stargazers_count || 0;
                if (starsB !== starsA) return starsB - starsA;
                return new Date(b.updated_at) - new Date(a.updated_at);
              });
              setRepos(sorted);
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }, []);

        if (loading) {
          return <div className="projects-loading">Loading projects...</div>;
        }

        const featured = repos.slice(0, 3);
        const regular = repos.slice(3);

        return (
          <div className="projects-magazine">
            <div className="magazine-header">
              <h1>Project Portfolio</h1>
              <p className="magazine-subtitle">A curated collection of software, robotics, and mechanical engineering projects</p>
            </div>

            {featured.length > 0 && (
              <div className="featured-section">
                <h2 className="section-title">Featured Projects</h2>
                <div className="featured-grid">
                  {featured.map((repo, idx) => (
                    <article className={`featured-card featured-${idx + 1}`} key={repo.id}>
                      <a href={repo.html_url} target="_blank" rel="noopener noreferrer" className="card-link">
                        <div className="card-image-wrapper">
                          <img src={repo.image} alt={repo.name} />
                          <div className="card-overlay">
                            <div className="card-stats">
                              {repo.stargazers_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-star"></i> {repo.stargazers_count}
                                </span>
                              )}
                              {repo.forks_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-code-branch"></i> {repo.forks_count}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                        <div className="card-content">
                          <h3>{repo.name}</h3>
                          <p className="card-description">{repo.description || 'No description available'}</p>
                          {repo.languages && (
                            <div className="card-tags">
                              {repo.languages.split(', ').slice(0, 3).map(lang => (
                                <span className="tag" key={lang}>{lang}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </a>
                    </article>
                  ))}
                </div>
              </div>
            )}

            {regular.length > 0 && (
              <div className="regular-section">
                <h2 className="section-title">All Projects</h2>
                <div className="projects-grid">
                  {regular.map(repo => (
                    <article className="project-card-magazine" key={repo.id}>
                      <a href={repo.html_url} target="_blank" rel="noopener noreferrer" className="card-link">
                        <div className="card-image-wrapper">
                          <img src={repo.image} alt={repo.name} />
                          <div className="card-overlay">
                            <div className="card-stats">
                              {repo.stargazers_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-star"></i> {repo.stargazers_count}
                                </span>
                              )}
                              {repo.forks_count > 0 && (
                                <span className="stat">
                                  <i className="fas fa-code-branch"></i> {repo.forks_count}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                        <div className="card-content">
                          <h3>{repo.name}</h3>
                          <p className="card-description">{repo.description || 'No description available'}</p>
                          {repo.languages && (
                            <div className="card-tags">
                              {repo.languages.split(', ').slice(0, 2).map(lang => (
                                <span className="tag" key={lang}>{lang}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </a>
                    </article>
                  ))}
                </div>
              </div>
            )}

            {repos.length === 0 && !loading && (
              <div className="no-projects">
                <p>No projects found.</p>
              </div>
            )}
          </div>
        );
      }

      const pages = {
        home: () => (
          <div className="home">
            <h1>Welcome to Ajinkya Gorad's Universe</h1>
            <p>Explore mechanical designs, software and robotics projects from my GitHub portfolio.</p>
            <div className="home-links">
              <a href="https://github.com/ajinkyagorad" target="_blank" rel="noopener">
                <i className="fab fa-github"></i> GitHub
              </a>
              <a href="https://grabcad.com/triton7777-1" target="_blank" rel="noopener">
                <i className="fas fa-cube"></i> GrabCAD
              </a>
              <a href="https://triton7777.wordpress.com/" target="_blank" rel="noopener">
                <i className="fas fa-pen-nib"></i> Blog
              </a>
            </div>
          </div>
        ),
        about: () => (
          <div className="about">
            <h1>About</h1>
            <p>To post stuff that people might care about.</p>
            <ul className="contacts">
              <li><a href="https://twitter.com/AjinkyaGorad">Twitter</a></li>
            </ul>
          </div>
        ),
        blog: BlogPage,
        projects: ProjectsPage
      };

    function App() {
      const [page, setPage] = React.useState('home');
      const PageComponent = pages[page];
      return (
        <div className="container">
          <nav>
            <button onClick={() => setPage('home')}>Home</button>
            <button onClick={() => setPage('about')}>About</button>
            <button onClick={() => setPage('blog')}>Blog</button>
            <button onClick={() => setPage('projects')}>Projects</button>
          </nav>
          <PageComponent />
          <footer>
            <button onClick={() => window.location='mailto:ajinkyagorad@gmail.com'}>Mail Me</button>
            <button onClick={() => window.open('https://github.com/ajinkyagorad','_blank')}>Github</button>
            <button onClick={() => window.open('https://twitter.com/ajinkya_gorad','_blank')}>Twitter</button>
            <button onClick={() => window.open('https://www.linkedin.com/in/ajinkyagorad','_blank')}>LinkedIn</button>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script type="module">
    import { startStarfield } from './js/starfield.js';
    startStarfield(document.getElementById('starfield'));
  </script>
  <script type="module">
    import { startP5Background } from './js/p5background.js';
    startP5Background();
  </script>
</body>
</html>
